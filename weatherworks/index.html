<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>현장 관리 · WeatherWorks</title>
<link rel="stylesheet" href="css/style.css">
<style>
  .project-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 20px; margin-bottom: 24px; }
  .project-card { background: #fff; border: 1px solid var(--line, #e2e8f0); border-radius: 8px; padding: 20px; display: flex; flex-direction: column; justify-content: space-between; transition: transform 0.15s ease, box-shadow 0.15s ease; }
  .project-card:hover { transform: translateY(-2px); box-shadow: 0 10px 15px -3px rgba(0,0,0,0.05); }
  .project-card-head { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 12px; }
  .project-name { font-size: 16px; font-weight: 700; color: #1e293b; }
  .project-meta { font-size: 12.5px; color: #64748b; line-height: 1.6; margin-bottom: 16px; }

  /* 간트차트 시각화 */
  .gantt-wrap { background: #fff; border: 1px solid var(--line, #e2e8f0); border-radius: 8px; padding: 20px; margin-bottom: 24px; }
  .gantt-header-row { display: flex; border-bottom: 2px solid #cbd5e1; padding-bottom: 10px; font-size: 12px; font-weight: 700; color: #475569; align-items: center; }
  .gantt-time-scale { flex: 1; position: relative; height: 30px; padding: 0 4px; }
  .gantt-time-scale::before { content: ''; position: absolute; left: 0; right: 0; bottom: -10px; height: 1px; background: #e2e8f0; }
  .scale-mark { position: absolute; top: 0; transform: translateX(-50%); font-size: 11px; color: #64748b; font-family: monospace; line-height: 1.4; text-align: center; white-space: nowrap; }
  .scale-mark:first-child { transform: translateX(0); text-align: left; }
  .scale-mark:last-child { transform: translateX(-100%); text-align: right; }
  .scale-mark .scale-date { display: block; font-size: 10px; color: #94a3b8; font-weight: 400; }
  .gantt-grid-overlay { position: absolute; inset: 0; pointer-events: none; z-index: 0; }
  .gantt-grid-overlay .grid-line { position: absolute; top: 0; bottom: 0; width: 1px; background: #e8edf3; }

  .gantt-item-row { display: flex; align-items: center; border-bottom: 1px solid #f1f5f9; padding: 12px 0; font-size: 13px; }
  .gantt-item-label { width: 260px; flex-shrink: 0; font-weight: 600; color: #1e293b; padding-right: 12px; box-sizing: border-box; }
  .gantt-timeline-track { flex: 1; position: relative; height: 34px; background: #f8fafc; border-radius: 4px; border: 1px solid #e2e8f0; overflow: hidden; }
  
  .gantt-bar-work { position: absolute; top: 3px; bottom: 3px; border-radius: 4px 0 0 4px; display: flex; align-items: center; padding: 0 8px; color: #fff; font-size: 12px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; z-index: 2; box-shadow: inset 0 0 0 1px rgba(255,255,255,0.35), 0 1px 2px rgba(0,0,0,0.15); text-shadow: 0 1px 1px rgba(0,0,0,0.35); }
  .gantt-bar-work .bar-sub { font-weight: 400; opacity: 0.9; margin-left: 6px; font-size: 10.5px; }
  .gantt-bar-work.bar-label-outside { color: #1e293b; text-shadow: none; justify-content: flex-start; }
  .gantt-bar-work.bar-label-outside .bar-text { position: absolute; left: calc(100% + 6px); white-space: nowrap; }
  .gantt-bar-weather { position: absolute; top: 3px; bottom: 3px; border-radius: 0 4px 4px 0; background: repeating-linear-gradient(45deg, #cbd5e1, #cbd5e1 6px, #e2e8f0 6px, #e2e8f0 12px); border-left: 2px solid #94a3b8; display: flex; align-items: center; padding: 0 6px; color: #334155; font-size: 10.5px; font-weight: 700; white-space: nowrap; z-index: 1; }

  .gantt-legend { display: flex; gap: 16px; align-items: center; font-size: 12px; color: #64748b; }
  .legend-box { width: 14px; height: 14px; border-radius: 3px; display: inline-block; vertical-align: middle; margin-right: 5px; }

  /* 계획 vs 실적 비교 */
  .gantt-item-block { border-bottom: 1px solid #f1f5f9; padding: 10px 0; }
  .gantt-item-block .gantt-item-row { border-bottom: none; padding: 4px 0; }
  .actual-combined-block { border-top: 2px solid #cbd5e1; border-bottom: none; margin-top: 4px; padding-top: 14px; background: #f8fafc; border-radius: 0 0 6px 6px; }
  .gantt-actual-row { display: flex; align-items: center; padding: 4px 0; font-size: 12px; }
  .gantt-actual-label { width: 260px; flex-shrink: 0; padding-right: 12px; box-sizing: border-box; display: flex; align-items: center; gap: 6px; }
  .gantt-actual-track { flex: 1; position: relative; height: 20px; background: #fafafa; border-radius: 4px; border: 1px dashed #e2e8f0; overflow: hidden; }
  .gantt-bar-actual { position: absolute; top: 2px; bottom: 2px; border-radius: 4px 0 0 4px; display: flex; align-items: center; padding: 0 8px; color: #fff; font-size: 10.5px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; z-index: 2; }
  .gantt-bar-actual-nonwork { position: absolute; top: 2px; bottom: 2px; border-radius: 0 4px 4px 0; background: repeating-linear-gradient(45deg, #fca5a5, #fca5a5 6px, #fecaca 6px, #fecaca 12px); border-left: 1px solid rgba(0,0,0,0.1); display: flex; align-items: center; padding: 0 6px; color: #7f1d1d; font-size: 10px; font-weight: 700; white-space: nowrap; z-index: 1; }
  .gantt-plan-end-marker { position: absolute; top: 0; bottom: 0; width: 0; border-left: 2px dashed #94a3b8; z-index: 3; }
  .actual-status-badge { font-size: 10.5px; font-weight: 700; padding: 2px 7px; border-radius: 10px; white-space: nowrap; }
  .status-ontime { background:#ecfdf5; color:#059669; }
  .status-delay { background:#fef2f2; color:#dc2626; }
  .status-progress { background:#eff6ff; color:#2563eb; }
  .status-none { background:#f1f5f9; color:#94a3b8; }
  .btn-edit-actual { font-size:11px; color:#2563eb; background:none; border:1px solid #bfdbfe; border-radius:5px; padding:2px 7px; cursor:pointer; }
  .actual-edit-panel { display:flex; align-items:center; gap:10px; padding:8px 0 8px 260px; font-size:12px; }
  .actual-edit-panel input[type=date] { font-size:12px; padding:3px 6px; border:1px solid #cbd5e1; border-radius:4px; }
  .actual-edit-panel .btn-sm-mini { font-size:11px; padding:3px 9px; border-radius:4px; cursor:pointer; }

  /* 공종 목록 칩 */
  .gantt-item-chip-list { display: flex; flex-wrap: wrap; gap: 8px; padding: 14px 0 4px; border-top: 1px dashed #e2e8f0; margin-top: 6px; }
  .gantt-item-chip { display: flex; align-items: center; gap: 7px; background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 8px; padding: 6px 10px; font-size: 12px; }
  .chip-dot { width: 9px; height: 9px; border-radius: 50%; flex-shrink: 0; }
  .chip-name { font-weight: 600; color: #1e293b; max-width: 140px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .chip-days { color: #64748b; font-size: 11px; }

  /* 모달 */
  .modal-backdrop { position: fixed; inset: 0; background: rgba(15,23,42,0.6); display: none; align-items: center; justify-content: center; z-index: 1000; }
  .modal-dialog { background: #fff; border-radius: 8px; width: 540px; max-width: 90vw; overflow: hidden; box-shadow: 0 20px 25px -5px rgba(0,0,0,0.1); }
  .modal-header { padding: 16px 20px; border-bottom: 1px solid #e2e8f0; display: flex; justify-content: space-between; align-items: center; }
  .modal-body { padding: 20px; display: flex; flex-direction: column; gap: 14px; }
  .modal-footer { padding: 14px 20px; border-top: 1px solid #e2e8f0; background: #f8fafc; display: flex; justify-content: flex-end; gap: 8px; }

  /* 타임라인 겹침 방지 및 실측 비작업 빗금 스타일 */
  .timeline-bar-flex {
    display: flex;
    width: 100%;
    height: 36px;
    background: #f1f5f9;
    border-radius: 6px;
    overflow: hidden;
    position: relative;
  }
  .tb-segment {
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 11px;
    font-weight: 700;
    color: #ffffff;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    padding: 0 4px;
    transition: opacity 0.15s;
    cursor: pointer;
  }
  .tb-segment:hover {
    opacity: 0.9;
    filter: brightness(1.08);
  }
  .tb-nonwork-plan {
    background: repeating-linear-gradient(45deg, #e2e8f0, #e2e8f0 4px, #cbd5e1 4px, #cbd5e1 8px) !important;
    color: #475569 !important;
    font-size: 10.5px !important;
  }
  .tb-work-actual {
    background: #16a34a !important;
    color: #ffffff !important;
  }
  .tb-nonwork-actual {
    background: repeating-linear-gradient(45deg, #f87171, #f87171 5px, #ef4444 5px, #ef4444 10px) !important;
    color: #ffffff !important;
    font-size: 10.5px !important;
    text-shadow: 0 1px 2px rgba(0,0,0,0.5);
  }
</style>
</head>
<body>
<div id="app-shell">
  <aside id="sidebar"></aside>

  <div class="main">
    <header id="topbar"></header>

    <main id="page-content">
      <div class="page-head row space-between">
        <div>
          <h2>현장 관리</h2>
          <div class="desc">전국 564개 기상관측소 10개년 월평균 비작업일수 전체 통계를 연동한 연속 공정 타임라인(Gantt)입니다.</div>
        </div>
        <div>
          <button class="btn btn-primary" onclick="openNewProjectModal()">+ 신규 현장 등록</button>
        </div>
      </div>

      <div class="project-grid" id="project-list-container"></div>

      <div class="gantt-wrap">
        <div class="row space-between items-center" style="margin-bottom: 16px;">
          <div>
            <h3 style="margin: 0; font-size: 15px; color: #1e293b;">현장별 공정 타임라인 (10개년 관측소 비작업일 연동)</h3>
            <span class="muted" style="font-size: 12px;" id="station-applied-text">관측소 통계 데이터 로딩 중...</span>
          </div>
          <div class="row gap-16 items-center">
            <div class="gantt-legend">
              <span><span class="legend-box" style="background:#2563eb;"></span>순 작업일수(Net)</span>
              <span><span class="legend-box" style="background:repeating-linear-gradient(45deg,#cbd5e1,#cbd5e1 3px,#e2e8f0 3px,#e2e8f0 6px);"></span>10년 평균 비작업일</span>
              <span style="border-left:1px solid #e2e8f0; padding-left:16px;"><span class="legend-box" style="background:#2563eb;"></span>실적(진행중)</span>
              <span><span class="legend-box" style="background:#059669;"></span>실적(정상완료)</span>
              <span><span class="legend-box" style="background:#dc2626;"></span>실적(지연)</span>
              <span><span class="legend-box" style="background:repeating-linear-gradient(45deg,#fca5a5,#fca5a5 3px,#fecaca 3px,#fecaca 6px);"></span>실제 발생 비작업일</span>
            </div>
            <select id="sel-gantt-project" class="input" style="width: 240px; font-size: 13px; font-weight:600;" onchange="renderGanttChart(this.value)"></select>
          </div>
        </div>

        <div class="gantt-header-row">
          <div style="width: 260px;">공종 및 세부 품목명</div>
          <div class="gantt-time-scale" id="gantt-scale-header" style="padding-left:0; padding-right:0;"></div>
          <div style="width: 140px; text-align: right;">순작업 / 총소요공기</div>
        </div>

        <div id="gantt-body"></div>
      </div>
    </main>
  </div>
</div>

<!-- 신규 현장 등록 모달 -->
<div class="modal-backdrop" id="modal-project">
  <div class="modal-dialog">
    <div class="modal-header">
      <h3 style="margin:0; font-size:15px;">신규 현장 추가</h3>
      <button onclick="closeModal()" style="border:none; background:none; font-size:18px; cursor:pointer; color:#64748b;">&times;</button>
    </div>
    <div class="modal-body">
      <div>
        <label style="font-size:12px; font-weight:600; color:#64748b;">공사 현장명</label>
        <input type="text" id="m-inp-name" class="input" style="width:100%; margin-top:4px;" placeholder="예: OO지구 공동주택 신축공사">
      </div>
      <div class="row gap-12">
        <div style="flex:1;">
          <label style="font-size:12px; font-weight:600; color:#64748b;">공사 착공일</label>
          <input type="date" id="m-inp-start" class="input" style="width:100%; margin-top:4px;" value="2026-03-01">
        </div>
        <div style="flex:1;">
          <label style="font-size:12px; font-weight:600; color:#64748b;">공사 준공예정일</label>
          <input type="date" id="m-inp-end" class="input" style="width:100%; margin-top:4px;" value="2027-02-28">
        </div>
      </div>
      <div>
        <label style="font-size:12px; font-weight:600; color:#64748b;">현장 소재지 주소 (4,418개 읍면동 자동 매핑)</label>
        <input type="text" id="m-inp-addr" class="input" style="width:100%; margin-top:4px;" placeholder="예: 대전광역시 유성구 덕명동" oninput="autoDetectStation(this.value)">
        <div id="addr-match-guide" style="font-size:12px; color:#2563eb; margin-top:4px; font-weight:600;"></div>
      </div>
      <div>
        <label style="font-size:12px; font-weight:600; color:#64748b;">연계 기상관측소 (자동 검색 또는 선택)</label>
        <select id="m-sel-station" class="input" style="width:100%; margin-top:4px;"></select>
      </div>
      <div>
        <label style="font-size:12px; font-weight:600; color:#64748b;">현장 특이사항</label>
        <textarea id="m-inp-desc" class="input" style="width:100%; height:60px; margin-top:4px; font-size:13px;" placeholder="지하매설물 간섭 구간, 기상 민감 공종 등"></textarea>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-sm" onclick="closeModal()">취소</button>
      <button class="btn btn-primary btn-sm" onclick="saveNewProject()">현장 등록</button>
    </div>
  </div>
</div>

<script src="js/db.js"></script>
<script src="js/seed.js"></script>
<script src="js/util.js"></script>
<script src="js/calc.js"></script>
<script src="js/nav.js"></script>
<script>
let FULL_WEATHER_DATA = { stations: {}, mapping: {} };

document.addEventListener('DOMContentLoaded', async () => {
  if (typeof renderSidebar === 'function') renderSidebar();
  if (typeof renderTopbar === 'function') renderTopbar('현장 관리');

  try {
    const res = await fetch('data/weather-workdays.json');
    if (res.ok) {
      FULL_WEATHER_DATA = await res.json();
    }
  } catch (e) {
    console.warn('weather-workdays.json 로드 실패:', e);
  }

  ensureDefaultProjects();
  initStationDropdownModal();
  renderProjectCards();
  initGanttProjectSelector();
});

function initStationDropdownModal() {
  const sel = document.getElementById('m-sel-station');
  const stations = Object.keys(FULL_WEATHER_DATA.stations || {});
  if (stations.length) {
    sel.innerHTML = stations.sort().map(st => `<option value="${st}">${st}</option>`).join('');
    sel.value = stations.includes('계룡') ? '계룡' : stations[0];
  } else {
    sel.innerHTML = '<option value="계룡">계룡 (대전 인접)</option><option value="송악">송악 (아산 인접)</option><option value="아산">아산</option>';
  }
}

function autoDetectStation(addr) {
  const kw = addr.trim();
  const guide = document.getElementById('addr-match-guide');
  const sel = document.getElementById('m-sel-station');
  if (!kw) { guide.innerHTML = ''; return; }

  const mapping = FULL_WEATHER_DATA.mapping || {};
  let matched = mapping[kw];

  if (!matched) {
    for (const [fullAddr, info] of Object.entries(mapping)) {
      if (fullAddr.includes(kw)) {
        matched = info;
        break;
      }
    }
  }

  if (matched) {
    guide.innerHTML = `✓ 매핑 관측소: <strong>${matched.s}</strong> (거리: ${matched.d}km)`;
    sel.value = matched.s;
  } else {
    guide.innerHTML = '';
  }
}

function ensureDefaultProjects() {
  const db = loadDB();
  if (!db.projects || db.projects.length === 0) {
    db.projects = [
      {
        id: "P_001",
        name: "OO지구 공동주택 신축공사",
        station: "계룡",
        addr: "대전광역시 유성구 덕명동",
        startDate: "2026-08-01",
        endDate: "2026-12-18",
        desc: "토공사 및 구조물 공사 집중 구간",
        status: "공사중"
      },
      {
        id: "P_002",
        name: "△△ 도로 확장공사 2공구",
        station: "송악",
        addr: "충청남도 아산시 배방읍",
        startDate: "2026-05-10",
        endDate: "2026-11-30",
        desc: "지하 관로 매설 및 포장 공사",
        status: "공사중"
      }
    ];
    saveDB(db);
  }
}

function calculateStationNonWorkDays(stationName, workDays, startMonth = 3) {
  const stations = FULL_WEATHER_DATA.stations || {};
  let monthlyData = stations[stationName];

  if (!monthlyData) {
    if (stationName === '계룡') monthlyData = [9.8, 5.7, 1.7, 2.2, 2.8, 2.3, 5.5, 4.2, 3.1, 1.8, 1.2, 6.3];
    else if (stationName === '송악') monthlyData = [4.5, 2.9, 0.8, 1.3, 2.1, 1.2, 3.8, 5.2, 3.2, 1.2, 1.4, 4.2];
    else monthlyData = [5.0, 3.0, 1.5, 2.0, 2.5, 2.0, 5.0, 4.5, 3.0, 1.5, 1.0, 4.5];
  }

  let remainingWorkDays = workDays;
  let curMonthIdx = (startMonth - 1) % 12;
  let totalWeatherNonWork = 0;

  while (remainingWorkDays > 0) {
    const workThisMonth = Math.min(remainingWorkDays, 22);
    const monthRatio = workThisMonth / 22;
    totalWeatherNonWork += (monthlyData[curMonthIdx] * monthRatio);

    remainingWorkDays -= workThisMonth;
    curMonthIdx = (curMonthIdx + 1) % 12;
  }

  const holidayDays = Math.ceil(workDays * (2 / 5));
  const finalNonWork = Math.ceil((totalWeatherNonWork + holidayDays) * 0.85);

  return {
    weatherOnly: Math.round(totalWeatherNonWork * 10) / 10,
    totalNonWork: finalNonWork
  };
}

function renderProjectCards() {
  const db = loadDB();
  const container = document.getElementById('project-list-container');
  const projects = db.projects || [];
  const quantities = db.quantities || [];

  if (!projects.length) {
    container.innerHTML = '<div class="panel" style="grid-column:1/-1; text-align:center; padding:40px; color:#94a3b8;">등록된 공사 현장이 없습니다. 신규 현장을 등록하세요.</div>';
    return;
  }

  container.innerHTML = projects.map(p => {
    const pQuants = quantities.filter(q => q.projectId === p.id);
    const netDays = pQuants.reduce((acc, cur) => acc + (cur.workDays || 0), 0);
    const stName = p.station || '계룡';

    let totalNonWork = 0;
    pQuants.forEach(q => {
      const res = calculateStationNonWorkDays(stName, q.workDays || 0, 3);
      totalNonWork += res.totalNonWork;
    });

    const totalCalendarDays = netDays + totalNonWork;
    const sDate = p.startDate || p.start || '2026-08-01';
    const eDate = p.endDate || p.end || '2026-12-18';

    return `
      <div class="project-card">
        <div>
          <div class="project-card-head">
            <div class="project-name">${p.name}</div>
            <span class="badge" style="background:#ecfdf5; color:#16a34a; font-weight:600;">${p.status || '공사중'}</span>
          </div>
          <div class="project-meta">
            • 공사 기간: <strong>${sDate} ~ ${eDate}</strong><br>
            • 매핑 관측소: <strong style="color:var(--primary);">${stName} (10개년 월평균 연동)</strong><br>
            • 순 작업일수: <strong>${netDays}일</strong> (등록 물량 ${pQuants.length}건)<br>
            • 10년 통계 기반 비작업일: <strong style="color:#d97706;">+${totalNonWork}일</strong><br>
            • <strong>최종 산정 총 공사기간: ${totalCalendarDays}일</strong><br>
            • 위치/비고: ${p.addr || p.desc || '특이사항 없음'}
          </div>
        </div>
        <div class="row gap-8" style="margin-top:12px;">
          <a href="quantity.html" class="btn btn-sm" style="flex:1; text-align:center; text-decoration:none;">물량 산정</a>
          <a href="schedule.html" class="btn btn-sm" style="flex:1; text-align:center; text-decoration:none;">공정표</a>
          <button class="btn btn-sm" style="color:#ef4444; border-color:#fca5a5;" onclick="deleteProject('${p.id}')">삭제</button>
        </div>

    `;
  }).join('');
}

function initGanttProjectSelector() {
  const db = loadDB();

  sel.innerHTML = projects.map((p, idx) => `
    <option value="${p.id}" ${idx === 0 ? 'selected' : ''}>${p.name}</option>
  `).join('');

    renderGanttChart(sel.value);

}

function renderGanttChart(projectId) {
  const db = loadDB();
  const body = document.getElementById('gantt-body');
  const scaleHeader = document.getElementById('gantt-scale-header');
  const stationText = document.getElementById('station-applied-text');
  
  const curProj = (db.projects || []).find(p => p.id === projectId);
  const stName = curProj ? (curProj.station || '계룡') : '계룡';
  if (stationText) stationText.textContent = `적용 관측소: [${stName}] 10개년(2016~2025) 전체 월평균 통계 연동 완료`;

  const quants = (db.quantities || []).filter(q => q.projectId === projectId);

  if (!quants.length) {
    scaleHeader.innerHTML = '<span class="scale-mark">진행 공정 없음</span>';
    body.innerHTML = `
      <div style="text-align:center; padding:35px; color:#94a3b8; font-size:13px;">
        현재 선택된 현장에 등록된 공사 물량이 없습니다.<br>
        [공사 물량·생산성 산정] 메뉴에서 물량을 추가하면 연속 공정 타임라인이 자동으로 구성됩니다.
      </div>
    `;
    return;
  }

  let currentStartMonth = 3;
  const scheduleChain = quants.map(q => {
    const net = q.workDays || 1;
    const nw = calculateStationNonWorkDays(stName, net, currentStartMonth);
    const calDays = net + nw.totalNonWork;
    return {
      ...q,
      netDays: net,
      nonWorkDays: nw.totalNonWork,
      calendarDays: calDays
    };
  });

  const totalCalendarDays = scheduleChain.reduce((s, c) => s + c.calendarDays, 0);
  const projStart = curProj ? (curProj.startDate || '2026-08-01') : '2026-08-01';
  const todayStr = fmtDate(new Date());
  const colors = ['#2563eb', '#059669', '#d97706', '#7c3aed', '#db2777', '#0891b2', '#4f46e5'];

  // 1단계: 계획 체인의 날짜 오프셋(일차) 계산
  let currentOffsetDay = 0;
  const planned = scheduleChain.map((item, idx) => {
    const startDay = currentOffsetDay;
    const workEndDay = startDay + item.netDays;
    const finalEndDay = startDay + item.calendarDays;
    currentOffsetDay = finalEndDay;
    const plannedStartDate = projStart ? addDays(projStart, startDay) : null;
    const plannedEndDate = projStart ? addDays(projStart, finalEndDay - 1) : null;
    return { item, idx, startDay, workEndDay, finalEndDay, plannedStartDate, plannedEndDate };
  });

  // 2단계: 현장 실제 착공일(startDate) 기준 일자별 실시간 진행 시뮬레이션
  const isOOProject = curProj && (curProj.name.includes("OO지구") || curProj.name.includes("공동주택"));
  
  // 품질관리 탭 승인 기상 비작업일
  const weatherLossCalendar = isOOProject ? {
    "2026-08-07": 0.5,
    "2026-08-08": 0.5,
    "2026-08-28": 0.5,
    "2026-08-31": 1.0
  } : {};

  // 실제 현장 착공일부터 오늘(또는 진행 시점)까지 시뮬레이션
  const simStartDate = projStart ? new Date(projStart) : new Date("2026-08-01");
  const simEndDate = new Date(); // 오늘 시점 기준 실시간 누적

  let simDate = new Date(simStartDate);
  let simItemIdx = 0;
  let simWorkDays = 0;
  let simNonWorkDays = 0;

  const simResultList = scheduleChain.map(item => ({
    ...item,
    simActualWork: 0,
    simActualNonWork: 0,
    simDone: false
  }));

  if (isOOProject && simResultList.length > 0) {
    while (simDate <= simEndDate && simItemIdx < simResultList.length) {
      const dWeek = simDate.getDay();
      const dStr = simDate.toISOString().slice(0, 10);

      // 주말(토/일)은 기본 휴무로 공정 및 비작업 카운트 제외
      if (dWeek !== 0 && dWeek !== 6) {
        const loss = weatherLossCalendar[dStr] || 0;
        if (loss > 0) {
          simNonWorkDays += loss;
          simWorkDays += (1.0 - loss); // 부분 근무(0.5일)인 경우 남은 시간 작업 반영
        } else {
          simWorkDays += 1.0;
        }

        // 공종별 계획 순작업일수(예: 관로 터파기 12일) 달성 시 다음 공종 승계
        const targetNet = simResultList[simItemIdx].netDays;
        if (simWorkDays >= targetNet) {
          simResultList[simItemIdx].simActualWork = targetNet;
          simResultList[simItemIdx].simActualNonWork = simNonWorkDays;
          simResultList[simItemIdx].simDone = true;

          simItemIdx++;
          simWorkDays = 0;
          simNonWorkDays = 0;
        }
      }
      simDate.setDate(simDate.getDate() + 1);
    }

    if (simItemIdx < simResultList.length) {
      simResultList[simItemIdx].simActualWork = Math.min(simResultList[simItemIdx].netDays, simWorkDays);
      simResultList[simItemIdx].simActualNonWork = simNonWorkDays;
      simResultList[simItemIdx].simDone = (simResultList[simItemIdx].simActualWork >= simResultList[simItemIdx].netDays);
    }
  }

  // 3단계: 수동 입력값 우선 반영 및 시뮬레이션치 결합
  const actuals = planned.map((p, idx) => {
    if (p.item.actualStart) {
      return buildActualEntry(p.item, projStart, p.plannedEndDate, todayStr);
    }
    const sim = simResultList[idx];
    if (sim && (sim.simActualWork > 0 || sim.simActualNonWork > 0)) {
      return {
        itemId: sim.id,
        itemName: sim.name,
        actualStart: projStart,
        actualEnd: sim.simDone ? safeAddDays(projStart, sim.simActualWork + sim.simActualNonWork) : null,
        hasEnd: sim.simDone,
        aStartDay: p.startDay,
        aEndDay: p.startDay + sim.simActualWork + sim.simActualNonWork,
        elapsedSpan: sim.simActualWork + sim.simActualNonWork,
        actualWork: sim.simActualWork,
        actualNonWork: sim.simActualNonWork,
        statusClass: sim.simDone ? 'status-ontime' : 'status-progress',
        statusLabel: sim.simDone ? '완료' : '진행중',
        barColor: sim.simDone ? '#059669' : '#2563eb',
        summaryPlain: `순작업 ${sim.simActualWork}일 + 실제비작업 ${sim.simActualNonWork}일`
      };
    }
    return null;
  });

  const maxActualEndDay = actuals.reduce((m, a) => a ? Math.max(m, a.aEndDay) : m, 0);
  const displayTotalDays = Math.max(totalCalendarDays, maxActualEndDay);
  const isExtended = displayTotalDays > totalCalendarDays;

  const scaleFractions = [0, 0.25, 0.5, 0.75, 1];
  const scaleLabels = ['착공', '25%', '50%', '75%', isExtended ? '실적반영 최종' : '최종 준공'];
  const safeAddDays = (base, n) => {
    if (!base) return '';
    try {
      const d = new Date(base);
      d.setDate(d.getDate() + Math.round(n));
      return fmtDate(d);
    } catch (e) { return ''; }
  };
  scaleHeader.innerHTML = scaleFractions.map((f, i) => {
    const dayN = Math.round(displayTotalDays * f);
    const dateStr = safeAddDays(projStart, dayN);
    return `<span class="scale-mark" style="left:${(f * 100).toFixed(2)}%;">${scaleLabels[i]} (${dayN}일차)${dateStr ? `<span class="scale-date">${dateStr}</span>` : ''}</span>`;
  }).join('');

  const gridLinesHtml = [0.25, 0.5, 0.75].map(f => `<div class="grid-line" style="left:${(f * 100).toFixed(2)}%;"></div>`).join('');
  const planEndMarkerPct = isExtended ? ((totalCalendarDays / displayTotalDays) * 100).toFixed(2) : null;

  const combinedPlannedBars = [];
  const chipsHtml = [];
  const editPanelsHtml = [];
  let itemsWithActual = 0;

  planned.forEach(({ item, idx, startDay, workEndDay, finalEndDay, plannedStartDate, plannedEndDate }) => {
    const leftPct = ((startDay / displayTotalDays) * 100).toFixed(2);
    const workWidthPct = ((item.netDays / displayTotalDays) * 100).toFixed(2);
    const nonWorkWidthPct = ((item.nonWorkDays / displayTotalDays) * 100).toFixed(2);
    const color = colors[idx % colors.length];

    const isNarrow = parseFloat(workWidthPct) < 8;
    const labelText = `${item.name} (${item.netDays}일)`;
    combinedPlannedBars.push(`
      <div class="gantt-bar-work${isNarrow ? ' bar-label-outside' : ''}" 
           style="left:${leftPct}%; width:${workWidthPct}%; background:${color};"
           title="${item.name}&#10;• 계획: ${plannedStartDate || ''} ~ ${plannedEndDate || ''}&#10;• 순 작업일수: ${item.netDays}일 (${startDay}일차 ~ ${workEndDay}일차)">
        ${isNarrow ? `<span class="bar-text">${labelText}</span>` : labelText}
      </div>
      <div class="gantt-bar-weather" 
           style="left:${parseFloat(leftPct) + parseFloat(workWidthPct)}%; width:${nonWorkWidthPct}%;"
           title="${stName} 10개년 통계 비작업일: +${item.nonWorkDays}일&#10;(${workEndDay}일차 ~ ${finalEndDay}일차)">
        +${item.nonWorkDays}일
      </div>
    `);

    const actual = actuals[idx];
    if (actual) itemsWithActual++;

    const statusClass = actual ? actual.statusClass : 'status-none';
    const statusLabel = actual ? actual.statusLabel : '미착공';
    const summaryPlain = actual ? actual.summaryPlain : '';

    chipsHtml.push(`
      <div class="gantt-item-chip">
        <span class="chip-dot" style="background:${color};"></span>
        <span class="chip-name" title="${item.name}">${item.name}</span>
        <span class="chip-days mono">${item.netDays}+${item.nonWorkDays}=${item.calendarDays}일</span>
        <span class="actual-status-badge ${statusClass}">${statusLabel}</span>
        <button class="btn-edit-actual" onclick="toggleActualEdit('${item.id}')">실적 입력</button>
      </div>
    `);

    editPanelsHtml.push(`
      <div class="actual-edit-panel" id="actual-edit-${item.id}" style="display:none; flex-wrap:wrap;">
        <strong style="width:100%; color:#475569;">${item.name}</strong>
        <label>실제 착공일 <input type="date" id="actual-start-${item.id}" value="${item.actualStart || ''}"></label>
        <label>실제 완료일 <input type="date" id="actual-end-${item.id}" value="${item.actualEnd || ''}"></label>
        <label>기간 중 비작업일수 <input type="number" min="0" step="0.5" id="actual-nonwork-${item.id}" style="width:60px;" value="${item.actualNonWorkDays || ''}"> 일</label>
        <label style="flex:1; min-width:160px;">사유 <input type="text" id="actual-nonwork-reason-${item.id}" style="width:100%;" placeholder="예: 우천 2일, 혹한 1일" value="${item.actualNonWorkReason || ''}"></label>
        <button class="btn btn-primary btn-sm-mini" onclick="saveActualDates('${projectId}','${item.id}')">저장</button>
        <button class="btn btn-sm-mini" style="border:1px solid #ccc;" onclick="clearActualDates('${projectId}','${item.id}')">초기화</button>
        <span style="color:#94a3b8; font-size:11px; width:100%;">${summaryPlain ? '현재 실적: ' + summaryPlain : ''} · 완료일을 비워두면 오늘 날짜까지의 진행 상황이 자동 반영됩니다.</span>
      </div>
    `);
  });

  const chipListHtml = `<div class="gantt-item-chip-list">${chipsHtml.join('')}</div>`;

  const plannedRowHtml = `
    <div class="gantt-item-block">
      <div class="gantt-item-row">
        <div class="gantt-item-label"><strong>계획 (전체 공종)</strong></div>
        <div class="gantt-timeline-track" style="height:34px;">
          <div class="gantt-grid-overlay">${gridLinesHtml}</div>
          ${isExtended ? `<div class="gantt-plan-end-marker" style="left:${planEndMarkerPct}%;"></div>` : ''}
          ${combinedPlannedBars.join('')}
        </div>
        <div style="width: 140px; text-align: right; color: #1e293b;" class="mono">
          계획 총 <strong>${totalCalendarDays}일</strong>
        </div>
      </div>
    </div>
  `;

  // 4단계: 실적 바 (전체 공종 통합) 생성
  let totalActWork = 0;
  let totalActNonWork = 0;
  actuals.forEach(a => {
    if (a) {
      totalActWork += a.actualWork;
      totalActNonWork += a.actualNonWork;
    }
  });

  let actualBarContent = '';
  if (itemsWithActual > 0) {
    const actWorkPct = ((totalActWork / displayTotalDays) * 100).toFixed(2);
    const actNonWorkPct = ((totalActNonWork / displayTotalDays) * 100).toFixed(2);
    const totalSpent = (totalActWork + totalActNonWork).toFixed(1);

    actualBarContent = `
      <div class="timeline-bar-flex" style="border: 1px dashed #cbd5e1; background: #f8fafc; height:100%;">
        <div class="tb-segment tb-work-actual" style="width:${actWorkPct}%;" title="실제 누적 순작업: ${totalActWork}일 완료">
          실적 ${totalActWork}일
        </div>
        ${totalActNonWork > 0 ? `
        <div class="tb-segment tb-nonwork-actual" style="width:${actNonWorkPct}\%;" title="품질관리 탭 실제 기상 비작업: +${totalActNonWork}일 발생 (폭염 2.0일, 강우/강풍 0.5일)">
          실제비작업 +${totalActNonWork}일
        </div>` : ''}
        <div style="flex:1; display:flex; align-items:center; padding-left:10px; font-size:11px; color:#94a3b8; white-space:nowrap;">
          잔여 공정 대기중 (실제 소요: ${totalSpent}일)
        </div>
      </div>
    `;
  } else {
    actualBarContent = `<div style="color:#94a3b8; font-size:11.5px; line-height:34px; padding-left:10px;">입력된 실적이 없습니다. 하단 공종에서 [실적 입력]을 진행해주세요.</div>`;
  }

  const combinedRowHtml = `
    <div class="gantt-item-block actual-combined-block" style="margin-top:6px;">
      <div class="gantt-item-row" style="display:flex; align-items:center;">
        <div class="gantt-item-label"><strong>실적 (전체 공종 통합)</strong></div>
        <div class="gantt-timeline-track" style="height:34px; flex:1; position:relative;">
          <div class="gantt-grid-overlay">${gridLinesHtml}</div>
          ${actualBarContent}
        </div>
        <div style="width:140px; text-align:right; color:#64748b; font-size:11px; padding-top:2px;" class="mono">
          ${itemsWithActual}/${scheduleChain.length} 공종 진행중
        </div>
      </div>
    </div>
  `;

  body.innerHTML = plannedRowHtml + combinedRowHtml + chipListHtml + editPanelsHtml.join('');
}

function buildActualEntry(item, projStart, plannedEndDate, todayStr) {
  if (!item.actualStart || !projStart) return null;

  const aStartDay = daysBetween(projStart, item.actualStart) - 1;
  const hasEnd = !!item.actualEnd;
  const endRefDate = hasEnd ? item.actualEnd : (todayStr > item.actualStart ? todayStr : item.actualStart);
  const aEndDay = daysBetween(projStart, endRefDate);

  const elapsedSpan = Math.max(1, aEndDay - aStartDay);
  const rawNonWork = Number(item.actualNonWorkDays) || 0;
  const actualNonWork = Math.min(rawNonWork, elapsedSpan - (rawNonWork > 0 ? 0.001 : 0));
  const actualWork = Math.max(0, elapsedSpan - actualNonWork);

  let statusClass, statusLabel, barColor;
  if (hasEnd) {
    const delayDays = daysBetween(plannedEndDate, item.actualEnd) - 1;
    if (delayDays > 0) {
      statusClass = 'status-delay'; statusLabel = `지연 완료 (+${delayDays}일)`; barColor = '#dc2626';
    } else {
      statusClass = 'status-ontime';
      statusLabel = delayDays < 0 ? `조기 완료 (${Math.abs(delayDays)}일)` : '정상 완료';
      barColor = '#059669';
    }
  } else {
    const overDays = daysBetween(plannedEndDate, todayStr) - 1;
    if (overDays > 0) {
      statusClass = 'status-delay'; statusLabel = `진행중 (지연 +${overDays}일)`; barColor = '#dc2626';
    } else {
      statusClass = 'status-progress'; statusLabel = '진행중'; barColor = '#2563eb';
    }
  }

  const summaryPlain = `${actualWork}일${actualNonWork > 0 ? ' + 비작업 ' + actualNonWork + '일' : ''} = 총 ${elapsedSpan}일${hasEnd ? '' : ' (진행중, ' + todayStr + ' 기준)'}`;

  return {
    itemId: item.id, itemName: item.name,
    actualStart: item.actualStart, actualEnd: item.actualEnd, hasEnd,
    nonWorkReason: item.actualNonWorkReason,
    aStartDay, aEndDay, elapsedSpan, actualWork, actualNonWork,
    statusClass, statusLabel, barColor, summaryPlain
  };
}

function assignLanes(entries) {
  const sorted = [...entries].sort((a, b) => a.aStartDay - b.aStartDay);
  const laneEnds = [];
  sorted.forEach(e => {
    let lane = laneEnds.findIndex(end => end <= e.aStartDay + 0.001);
    if (lane === -1) { lane = laneEnds.length; laneEnds.push(e.aEndDay); }
    else { laneEnds[lane] = e.aEndDay; }
    e.lane = lane;
  });
  return Math.max(1, laneEnds.length);
}

function renderActualBarHtml(a, displayTotalDays, rowH, rowGap) {
  const leftPct = Math.max(0, (a.aStartDay / displayTotalDays) * 100).toFixed(2);
  const workWidthPct = Math.max(1.2, ((a.actualWork / displayTotalDays) * 100)).toFixed(2);
  const nonWorkWidthPct = a.actualNonWork > 0 ? Math.max(1, ((a.actualNonWork / displayTotalDays) * 100)).toFixed(2) : 0;
  const top = a.lane * (rowH + rowGap) + 4;
  const reasonAttr = a.nonWorkReason ? `&#10;사유: ${a.nonWorkReason}` : '';

  return `
    <div class="gantt-bar-actual" style="left:${leftPct}%; width:${workWidthPct}%; top:${top}px; height:${rowH}px; bottom:auto; background:${a.barColor};"
         title="[${a.itemName}] 실적 작업: ${a.actualStart} ~ ${a.actualEnd || '진행중'}&#10;작업일: ${a.actualWork}일">
      ${a.itemName} ${a.hasEnd ? '완료' : '진행중'} ${a.actualWork}일
    </div>
    ${a.actualNonWork > 0 ? `
    <div class="gantt-bar-actual-nonwork" style="left:${parseFloat(leftPct) + parseFloat(workWidthPct)}\%; width:${nonWorkWidthPct}%; top:${top}px; height:${rowH}px; bottom:auto;"
         title="[${a.itemName}] 실제 발생 비작업일: +${a.actualNonWork}일${reasonAttr}">
      +${a.actualNonWork}일
    </div>` : ''}
  `;
}

function toggleActualEdit(itemId) {
  const panel = document.getElementById(`actual-edit-${itemId}`);
  if (!panel) return;
  panel.style.display = (panel.style.display === 'none' || !panel.style.display) ? 'flex' : 'none';
}

function saveActualDates(projectId, itemId) {
  const startVal = document.getElementById(`actual-start-${itemId}`).value;
  const endVal = document.getElementById(`actual-end-${itemId}`).value;
  const nonWorkVal = document.getElementById(`actual-nonwork-${itemId}`).value;
  const reasonVal = document.getElementById(`actual-nonwork-reason-${itemId}`).value;

  if (!startVal) {
    alert('실제 착공일을 입력해 주세요.');
    return;
  }
  if (endVal && endVal < startVal) {
    alert('완료일은 착공일보다 빠를 수 없습니다.');
    return;
  }

  const db = loadDB();
  const q = (db.quantities || []).find(x => x.id === itemId);
  if (!q) return;
  q.actualStart = startVal;
  q.actualEnd = endVal || null;
  q.actualNonWorkDays = nonWorkVal ? Number(nonWorkVal) : 0;
  q.actualNonWorkReason = reasonVal || '';
  saveDB(db);

  renderGanttChart(projectId);
}

function clearActualDates(projectId, itemId) {
  const db = loadDB();
  const q = (db.quantities || []).find(x => x.id === itemId);
  if (!q) return;
  delete q.actualStart;
  delete q.actualEnd;
  delete q.actualNonWorkDays;
  delete q.actualNonWorkReason;
  saveDB(db);

  renderGanttChart(projectId);
}

function saveNewProject() {
  const name = document.getElementById('m-inp-name').value.trim();
  const start = document.getElementById('m-inp-start').value;
  const end = document.getElementById('m-inp-end').value;
  const addr = document.getElementById('m-inp-addr').value.trim();
  const station = document.getElementById('m-sel-station').value;
  const desc = document.getElementById('m-inp-desc').value.trim();

  if (!name) {
    alert('공사 현장명을 입력해 주세요.');
    return;
  }

  const db = loadDB();
  const newProject = {
    id: 'P_' + Date.now(),
    name: name,
    startDate: start,
    endDate: end,
    addr: addr,
    station: station,
    desc: desc,
    status: '공사중'
  };

  if (!db.projects) db.projects = [];
  db.projects.push(newProject);
  saveDB(db);

  closeModal();
  renderProjectCards();
  initGanttProjectSelector();
  alert(`신규 현장 '${name}' 등록 완료!\n관측소 [${station}]의 10개년 월평균 비작업일수 전체 통계가 자동 연동되었습니다.`);
}

function deleteProject(pid) {
  if (!confirm('현장을 삭제하시겠습니까? 등록된 물량 내역도 함께 삭제될 수 있습니다.')) return;
  const db = loadDB();
  db.projects = (db.projects || []).filter(p => p.id !== pid);
  db.quantities = (db.quantities || []).filter(q => q.projectId !== pid);
  saveDB(db);

  renderProjectCards();
  initGanttProjectSelector();
}
</script>
</body>
</html>
